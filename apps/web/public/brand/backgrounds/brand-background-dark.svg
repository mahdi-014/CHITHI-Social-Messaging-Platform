      <stop offset="0%" stop-color="#253B80" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#19C6C5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Solid Background -->
  <rect width="1920" height="1080" fill="#0B1220" />

