# ==============================================================================
# CHITHI — Isolated Staging Environment (docker-compose.staging.yml)
# Completely isolated volumes, database, and networking for release candidate QA
# ==============================================================================
services:
  postgres-staging:
    image: postgres:16-alpine
    container_name: chithi-postgres-staging
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chithi_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-chithi_staging_db}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chithi_staging} -d ${POSTGRES_DB:-chithi_staging_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chithi-staging-network

  api-staging:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chithi-api-staging
    restart: always
    depends_on:
      postgres-staging:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-chithi_staging}:${POSTGRES_PASSWORD}@postgres-staging:5432/${POSTGRES_DB:-chithi_staging_db}?connection_limit=15&pool_timeout=10
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/uploads
      BACKUP_DIR: /app/backups
      TURN_SECRET: ${TURN_SECRET:-chithi_staging_turn_secret}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
    volumes:
      - uploads_staging_data:/app/uploads
      - database_staging_backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chithi-staging-network

  web-staging:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8080}
    container_name: chithi-web-staging
    restart: always
    depends_on:
      api-staging:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chithi-staging-network

  nginx-staging:
    image: nginx:alpine
    container_name: chithi-nginx-staging
    restart: always
    ports:
      - "${STAGING_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-staging
      - web-staging
    networks:
      - chithi-staging-network

volumes:
  postgres_staging_data:
    driver: local
  uploads_staging_data:
    driver: local
  database_staging_backups:
    driver: local

networks:
  chithi-staging-network:
    driver: bridge
